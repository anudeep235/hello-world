name: simple push workflow
on: 
  push:
   branches:
     - main
     - dev
     - features/*
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5
      - name: setup node.js
        uses: actions/setup-node@v5
        with:
           node-version: '20'
      - name: Install dependencies
        run: npm install
