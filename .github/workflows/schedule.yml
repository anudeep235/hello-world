name: Manual workflow dispatch
on: 
  workflow_dispatch: 
   inputs:
     environments:
       description: 'selected environment'
       required: true
       default: 'dev'
        type: choice
        options:
          - dev
          - test
 schedule:
   cron: '* * * * *'
jobs:
  runs-manually:
  runs-on: ubuntu-latest
  steps:
     - name: Echo message
       run: echo "This workflow triggred manually using workflow.dispatch or by schedule."
          
