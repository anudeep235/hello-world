
          
name: Manual workflow dispatch

on:
  workflow_dispatch:
    inputs:
      environments:
        description: 'Selected environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - test

  schedule:
    - cron: '* * * * *'

jobs:
  runs-manually:
    runs-on: ubuntu-latest
    steps:
      - name: Echo message
        run: echo "This workflow was triggered manually or by schedule."
