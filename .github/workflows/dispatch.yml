name: Manual Workflow dispatch
on:
  workflow_dispatch: 
   inputs:
    environments:
      description: 'selected environment'
      required: true
      default: 'dev'
       type: choice
       options:
           - dev
           - test
jobs:
   runs-manually:
       runs-on: ubuntu-latest
       steps:
          - name: echo message
            run: echo "This is workflow was triggred manually using workflow-dispatch."
